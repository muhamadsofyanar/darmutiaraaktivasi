services:
  app:
    build: .
    expose:
      - "8000"
    environment:
      APP_DOMAIN: '${APP_DOMAIN}'
      ISSUER_URL: '${ISSUER_URL}'
      ISSUER_PUBLIC_KEY: '${ISSUER_PUBLIC_KEY}'
      ADMIN_USER: '${ADMIN_USER:-admin}'
      ADMIN_PASSWORD: '${ADMIN_PASSWORD}'
    volumes:
      - activation_data:/data

volumes:
  activation_data:
